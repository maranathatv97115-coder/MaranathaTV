<!DOCTYPE html>
<html lang="fr">
<head>

<title>Ste-Rose Maranatha TV</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

    background: linear-gradient(160deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  h1 { font-size: 3.2vw; margin-bottom: 0.4em; }
  h2 { font-size: 1.6vw; font-weight: normal; color: #b9d4e0; margin-bottom: 2em; }
  .btn {
    background: #e60000;
    color: #fff;
    font-size: 2.6vw;
    font-weight: bold;
    padding: 0.7em 1.6em;
    border-radius: 14px;
    text-decoration: none;
    border: 6px solid transparent;
    transition: all .2s;
  }
  .btn:focus, .btn:hover {
    outline: none;
    background: #ff1a1a;
    border-color: #fff;
    transform: scale(1.06);
  }
</style>
</head>

     href="https://www.youtube.com/@adv-larayette/live">

  </a>
  <!-- ⬆️⬆️⬆️  REMPLACEZ SEULEMENT L'ADRESSE ENTRE GUILLEMETS  ⬆️⬆️⬆️ -->

<script>

</script>

</body>
</html>
